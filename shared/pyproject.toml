[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-platform-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []  # numpy and opencv come from the image that installs this

[tool.setuptools.packages.find]
include = ["yolo_platform_shared*"]
