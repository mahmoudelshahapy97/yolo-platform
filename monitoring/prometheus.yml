# Scrape config for the single-server stack. Scaled services (camera-shard,
# video-worker) are discovered through Docker's DNS: the service name resolves to
# every replica.
global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: api
    dns_sd_configs: [{names: [api], type: A, port: 8000}]
  - job_name: triton
    static_configs: [{targets: ["triton:8002"]}]
  - job_name: camera-shard
    dns_sd_configs: [{names: [camera-shard], type: A, port: 9100}]
  - job_name: video-worker
    dns_sd_configs: [{names: [video-worker], type: A, port: 9100}]
  - job_name: event-processor
    dns_sd_configs: [{names: [event-processor], type: A, port: 9100}]
  - job_name: dcgm
    static_configs: [{targets: ["dcgm-exporter:9400"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
