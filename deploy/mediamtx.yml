# Test RTSP rig: one looping publisher per clip; any number of cameras can read a path.
#   rtsp://mediamtx:8554/sub0 .. sub5    ~640x360 substreams
#   rtsp://mediamtx:8554/main0 .. main5  1080p main streams
# Clips come from tools/gen_substreams.sh. Publishers start on first read and stop
# 10 s after the last reader leaves.
logLevel: warn
rtspTransports: [tcp]
rtmp: no
hls: no
webrtc: no
srt: no
api: no
readTimeout: 20s
writeTimeout: 20s
writeQueueSize: 1024
paths:
  "~^(sub|main)([0-5])$":
    runOnDemand: ffmpeg -loglevel error -re -stream_loop -1 -i /videos/$G1/clip$G2.mp4 -c copy -f rtsp rtsp://localhost:8554/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
